name: App veröffentlichen

# Stellt ausgabe/ als GitHub-Pages-Seite bereit (Handy-App).
# Läuft nach jedem Kursabruf und jeder Zertifikats-Änderung (auch fehlgeschlagen: dann zeigt die Seite die Störung),
# nach Pushes, die ausgabe/ ändern, und von Hand.
on:
  workflow_run:
    workflows: ["Kurse abrufen", "Zertifikat verwalten"]
    types: [completed]
  push:
    branches: [main]
    paths: ["ausgabe/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    # Fremde Issues lassen "Zertifikat verwalten" übersprungen enden: dann nichts neu veröffentlichen.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Immer den neuesten Stand von main, auch nach workflow_run (sonst wäre es der alte Commit).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ausgabe

      - id: deploy
        uses: actions/deploy-pages@v4
