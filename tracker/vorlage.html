<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.onvista.de; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="color-scheme" content="light dark">
<title>Discount-Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discount">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --sunk:#f1f1ee;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#6a6963;
  --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --band:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --up:#006300; --down:#c32f2f; --bar-pos:#2a78d6; --bar-neg:#e34948;
  --warn-bg:#fdf1e6; --warn-ink:#7a3b0b;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --sunk:#222220;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#a3a29a;
    --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --band:rgba(255,255,255,.045);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --up:#0ca30c; --down:#e66767; --bar-pos:#3987e5; --bar-neg:#e66767;
    --warn-bg:#2d2114; --warn-ink:#f1c89c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --sunk:#222220;
  --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#a3a29a;
  --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --band:rgba(255,255,255,.045);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --up:#0ca30c; --down:#e66767; --bar-pos:#3987e5; --bar-neg:#e66767;
  --warn-bg:#2d2114; --warn-ink:#f1c89c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:lining-nums}
.page{padding:20px 16px 48px;max-width:1680px;margin:0 auto}
@media(min-width:760px){.page{padding:32px 32px 64px}}
h1,h2,h3,p,dl,dd,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration-color:var(--axis);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
section{margin-top:44px}
section>h2{font-size:19px;line-height:1.3;font-weight:650;letter-spacing:-.01em;margin-bottom:14px}
.sub{color:var(--ink-3);font-size:13px}

/* Kopf */
.head h1{font-size:clamp(24px,4vw,34px);line-height:1.15;font-weight:700;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.pill{font-size:12.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--axis);border-radius:999px;padding:1px 10px;letter-spacing:0}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:18px}
@media(min-width:560px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.facts{grid-template-columns:repeat(6,minmax(0,1fr))}}
.facts dt{font-size:12.5px;color:var(--ink-3)}
.facts dd{font-size:15px;font-weight:550;overflow-wrap:anywhere}
.prog{margin-top:20px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-3)}
.prog .bar{flex:1;max-width:420px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink-2);border-radius:2px}
.warn{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px;border:1px solid var(--ring)}
.warn b{font-weight:650}

/* Kennzahlen */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border:1px solid var(--ring);border-radius:14px;overflow:hidden}
@media(min-width:900px){.strip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{padding:16px 18px;border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:0}
.strip .kpi:nth-child(-n+2){border-top:0}
.strip .kpi:nth-child(odd){border-left:0}
@media(min-width:900px){
  .strip .kpi{border-top:0;border-left:1px solid var(--line)}
  .strip .kpi:first-child{border-left:0}
}
.strip .kpi:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:900px){.strip .kpi:last-child:nth-child(odd){grid-column:auto}}
.kpi .k{font-size:13px;color:var(--ink-3)}
.kpi .v{font-size:clamp(22px,2.4vw,28px);font-weight:650;letter-spacing:-.015em;line-height:1.2;margin-top:2px}
.kpi .v small{font-size:.55em;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.kpi .d{font-size:13.5px;margin-top:2px;color:var(--ink-2)}
.kpi .s{font-size:12.5px;margin-top:6px;color:var(--ink-3)}
.kpi .s .up,.kpi .s .down{font-weight:550}
.wnote{font-size:13px;color:var(--ink-3);margin:-4px 0 10px}
.up{color:var(--up)} .down{color:var(--down)}
.up,.down{white-space:nowrap}
td small span{display:block}
@media(max-width:559px){td,th{padding-left:5px;padding-right:5px;font-size:14px}}
.delta-text{margin-top:14px;font-size:14.5px;color:var(--ink-2);max-width:78ch}

/* Tag */
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:14px}
.dayhead h2{margin:0}
.dayhead .back{font-size:13.5px;text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px;color:var(--ink-2)}
.daygrid{display:grid;gap:28px}
@media(min-width:960px){.daygrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px}}
.verdict{display:inline-block;font-size:14px;font-weight:600;border:1.5px solid var(--ink);border-radius:8px;padding:2px 10px;margin-bottom:10px}
.verdict.soft{border-color:var(--axis);color:var(--ink-2);font-weight:550}
.daytext{font-size:16px;line-height:1.55;max-width:66ch}
.eff{margin-top:22px}
.eff h3,.news h3{font-size:14px;font-weight:600;margin-bottom:10px}
.eff .rows{display:grid;gap:10px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l v" "t t";gap:3px 12px;align-items:baseline}
@media(min-width:560px){.erow{grid-template-columns:200px minmax(0,1fr) 78px;grid-template-areas:"l t v";align-items:center}}
.erow .l{grid-area:l;font-size:14px}
.erow .l em{font-style:normal;font-size:12.5px;color:var(--ink-3);margin-left:6px}
.erow .v{grid-area:v;text-align:right;font-size:14px;font-weight:550}
.track{grid-area:t;position:relative;height:12px}
.track::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.track i{position:absolute;top:2px;height:8px;border-radius:2px}
.track i.p{left:50%;background:var(--bar-pos);border-top-right-radius:4px;border-bottom-right-radius:4px}
.track i.n{right:50%;background:var(--bar-neg);border-top-left-radius:4px;border-bottom-left-radius:4px}
.erow.sum{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.erow.sum .track{display:none}
.erow.sum .l{font-weight:600}
.note{font-size:12.5px;color:var(--ink-3);margin-top:12px}
.newslist{display:grid;gap:14px}
.newslist li{padding-bottom:14px;border-bottom:1px solid var(--line)}
.newslist li:last-child{border-bottom:0}
.newslist .t{font-size:15px;font-weight:550;line-height:1.4}
.newslist .m{font-size:13px;color:var(--ink-3);margin-top:2px}
.empty{color:var(--ink-3);font-size:14.5px}

/* Chart */
.chartbox{background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:14px 14px 10px}
@media(min-width:760px){.chartbox{padding:18px 22px 12px}}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;border:1px solid var(--ring)}
.seg button{padding:6px 14px;border-radius:7px;font-size:14px;font-weight:550;color:var(--ink-2);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;min-height:34px}
.chk input{width:16px;height:16px;accent-color:var(--s1);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid}
.legend i.dash{border-top-style:dashed;border-top-width:2px}
.legend i.mk{width:8px;height:8px;border:2px solid var(--surface);outline:0;background:var(--ink);border-radius:50%;border-top:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}
.chartwrap{position:relative;outline-offset:4px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap svg text{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink-3)}
.chartwrap svg text.pt{fill:var(--ink-2);font-weight:600}
.chartwrap svg text.lb{fill:var(--ink-2);font-weight:550}
.grid{stroke:var(--line);stroke-width:1}
.axisl{stroke:var(--axis);stroke-width:1}
.band{fill:var(--band)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.z{stroke:var(--s1)} .ln.b{stroke:var(--s2)} .ln.d{stroke:var(--s3)}
.ln.w{stroke-width:1.5;opacity:.6}
.cap{stroke:var(--ink-3);stroke-width:1.25;stroke-dasharray:5 4}
.dot.z{fill:var(--s1)} .dot.b{fill:var(--s2)} .dot.d{fill:var(--s3)}
.mark{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.xh{stroke:var(--ink-3);stroke-width:1}
.sel{stroke:var(--ink);stroke-width:1.25;stroke-dasharray:2 3}
.hit{fill:transparent;touch-action:pan-y;cursor:crosshair}
@media(prefers-reduced-motion:no-preference){
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1000ms cubic-bezier(.3,.6,.2,1) forwards}
  @keyframes dr{to{stroke-dashoffset:0}}
}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--axis);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.45;min-width:190px;max-width:260px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:3}
.tip[hidden]{display:none}
.tip b{font-weight:650}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .r .n{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .r .n i{width:10px;height:0;border-top:2.5px solid}
.tip .h{color:var(--ink-3);font-size:12px;margin-top:4px}
.chartnote{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* Tabellen */
.tw{width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:550;color:var(--ink-3);text-align:right;padding:8px 8px;border-bottom:1px solid var(--axis);vertical-align:bottom}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-size:14.5px}
td small{display:block;font-size:12.5px;color:var(--ink-3)}
td .up,td .down{font-size:12.5px}
tr.vor td{color:var(--ink-2)}
.dbtn{display:flex;align-items:flex-start;gap:8px;text-align:left;width:100%;min-height:36px;font-weight:550}
.dbtn .ch{display:inline-block;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);margin-top:7px;flex:none;transition:transform .15s}
.dbtn[aria-expanded="true"] .ch{transform:rotate(45deg)}
.dbtn small{font-weight:400}
.jump{display:inline-block;font-size:11.5px;font-weight:650;line-height:1;padding:3px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink);margin-left:6px;vertical-align:1px;letter-spacing:.01em}
.dbtn .jump{display:table;margin:4px 0 0}
.jumpnote{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px;border:1px solid var(--ring)}
.flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:1px}
.vcol{display:none;text-align:left}
@media(min-width:900px){.vcol{display:table-cell}}
tr.det td{background:var(--sunk);text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
tr.det .daytext{font-size:14.5px}
.filter{margin-bottom:8px}
.lnk{font-size:13.5px;text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px;color:var(--ink-2);margin-top:10px;display:inline-block}

/* Menü */
.top{position:sticky;top:0;z-index:5;background:var(--page);margin:-20px -16px 22px;padding:10px 16px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:2px 18px}
@media(min-width:760px){.top{margin:-32px -32px 30px;padding:12px 32px 0}}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;text-decoration:none;padding:6px 0}
.menu{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 320px;min-width:0;-webkit-overflow-scrolling:touch}
.menu::-webkit-scrollbar{display:none}
.menu a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 12px 11px;font-size:14px;font-weight:550;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;min-height:40px}
.menu a:hover{color:var(--ink)}
.menu a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.lupe{width:11px;height:11px;border:1.75px solid currentColor;border-radius:50%;position:relative;margin-right:2px}
.lupe::after{content:"";position:absolute;width:5px;height:1.75px;background:currentColor;right:-4px;bottom:-2px;transform:rotate(45deg)}
.dot-warn{width:7px;height:7px;border-radius:50%;background:var(--down)}

/* Übersicht */
.ovhead h1{font-size:clamp(24px,4vw,32px);line-height:1.15;font-weight:700;letter-spacing:-.02em}
.ovhead .sub{margin-top:4px}
.daxline{margin-top:14px;font-size:14.5px;color:var(--ink-2)}
.ovw{margin-top:20px;overflow-x:auto;border:1px solid var(--ring);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.ov{width:auto;min-width:100%}
.ov th,.ov td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14.5px}
.ov tr:last-child th,.ov tr:last-child td{border-bottom:0}
.ov thead th{vertical-align:bottom;color:var(--ink);font-size:15px;font-weight:650;min-width:150px;border-bottom:1px solid var(--axis)}
.ov thead th small{display:block;font-size:12.5px;font-weight:450;color:var(--ink-3);margin-top:2px}
.ov tbody th{font-size:13px;font-weight:550;color:var(--ink-3);text-align:left;white-space:nowrap}
.ov th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line);min-width:0;padding-left:16px}
.ov td small{display:block;font-size:12.5px;margin-top:1px}
.ov td b{font-weight:650}
.zlink{text-decoration:none;font-weight:650}
.zlink:hover{text-decoration:underline}
.spark{display:block;width:120px;height:32px;overflow:visible}
.spark path{fill:none;stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.spark.up path{stroke:var(--up)} .spark.down path{stroke:var(--down)}
@media(max-width:559px){.ov th,.ov td{padding:10px 9px;font-size:14px}.ov thead th{min-width:116px}.ov th:first-child{padding-left:12px}
  .ov tbody th{white-space:normal;min-width:92px;max-width:104px;font-size:12.5px;line-height:1.3}.spark{width:100px}}

/* Suche */
.srch{display:block;margin-top:18px;max-width:560px}
.srch input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
.srch input:focus{outline:2px solid var(--s1);outline-offset:1px;border-color:transparent}
#qhint{margin-top:8px}
.hits{display:grid;gap:0;max-width:760px}
.hits .hit{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.hits .hit .lnk{margin:0;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border-radius:10px;background:var(--ink);color:var(--page);font-weight:600;font-size:14.5px;text-decoration:none;border:0}
.btn:hover{opacity:.9}
.btn[disabled]{opacity:.55;cursor:default}
.card{max-width:760px;background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px 18px}
.card h3{font-size:16px;font-weight:650;line-height:1.35}
.card .facts{margin:12px 0 16px}
@media(min-width:960px){.card .facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.how ol{list-style:decimal;padding-left:20px;display:grid;gap:6px;max-width:66ch;color:var(--ink-2);font-size:14.5px}

footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);display:grid;gap:4px}
.hint{margin:80px auto;max-width:44ch;text-align:center;color:var(--ink-2)}
.hint h1{font-size:22px;margin-bottom:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
